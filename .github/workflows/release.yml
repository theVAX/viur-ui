name: Release

# Veröffentlicht viur-ui auf npm, sobald ein Versions-Tag gepusht wird (wie in
# vi-vue-utils). Der Tag muss zur Version in package.json passen, z. B.
# v0.0.1-alpha für "version": "0.0.1-alpha". Der npm-Dist-Tag folgt dem
# Suffix: -alpha → alpha, -beta → beta, -rc → rc, sonst latest.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@latest

      - run: npm ci

      - name: Tag must match package.json
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} passt nicht zu package.json (${VERSION})"
            exit 1
          fi

      - name: Determine npm tag
        id: npm_tag
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Detected tag: $TAG_NAME"

          if [[ "$TAG_NAME" =~ -alpha(\.?[0-9]+)?$ ]]; then
            echo "tag=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" =~ -beta(\.?[0-9]+)?$ ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" =~ -rc(\.?[0-9]+)?$ ]]; then
            echo "tag=rc" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm (Trusted Publishing)
        run: npm publish --access public --tag ${{ steps.npm_tag.outputs.tag }}
